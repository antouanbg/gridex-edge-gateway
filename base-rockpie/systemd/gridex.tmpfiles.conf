# Exact paths only. Never recursively change ownership of backups or secrets.
d /var/lib/gridex 0750 gridex gridex -
d /var/log/gridex 0750 gridex gridex -
# f creates an absent file but does not truncate an existing journal.
f /var/lib/gridex/telemetry-journal.ndjson 0640 gridex gridex -
z /var/lib/gridex/telemetry-journal.ndjson 0640 gridex gridex -
z /var/lib/gridex/telemetry-journal.ndjson.1 0640 gridex gridex -
